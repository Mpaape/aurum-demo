# Workflow do serviço: toda PR passa pela revisão do AurumCode com as duas
# camadas centrais. run.sh troca c638e04b8ff7486070379b81b8658e4b3c0a6a92, Mpaape/aurum-demo-security-policy, 1e9dccd260299c505c0d88de05020257731eae9d,
# Mpaape/aurum-demo-devops-policy e a077f09ee02536b36fcb7507587af6e3a144de57 pelos valores da execução.
name: Code review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
  statuses: write
  checks: read
jobs:
  review:
    uses: Mpaape/AurumCode/.github/workflows/review.yml@v2.0.0
    with:
      model: ${{ vars.LLM_MODEL }}
      provider: ${{ vars.LLM_PROVIDER }}   # perfil do provedor (ex.: anthropic); vazio = endpoint OpenAI-compatível
      policy_repository: Mpaape/aurum-demo-security-policy        # segurança: gate, regras IA-*, ignore e exceções
      policy_ref: 8e31dd4dbcbf4ba1809daad89772a1435c747358                # SHA fixa da main do security-policy
      standards_repository: Mpaape/aurum-demo-devops-policy  # engenharia: skills PAD-*/QA-* e analistas padroes e qa
      standards_ref: c6e2d8c5b667295a3350bb83abee56f39e3b37b9          # SHA fixa da main do devops-policy
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      AURUMCODE_POLICY_TOKEN: ${{ secrets.AURUMCODE_POLICY_TOKEN }}        # só se o security-policy for privado
      AURUMCODE_STANDARDS_TOKEN: ${{ secrets.AURUMCODE_STANDARDS_TOKEN }}  # só se o devops-policy for privado

  # SARIF na aba Security (Code scanning): o reutilizável só anexa o arquivo
  # como artefato, porque enviar exige security-events: write, que só este
  # workflow concede. PR de fork não recebe a permissão: o if pula.
  upload-sarif:
    name: SARIF na aba Security
    needs: review
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aurumcode-sarif-${{ github.event.pull_request.number }}
          path: .
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: aurumcode-review.sarif
          category: aurumcode
