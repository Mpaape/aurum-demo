# Testes do plugin agendado (gerador de perfil do harness), em toda PR que
# mexe nele.
name: Plugin tests
on:
  pull_request:
    paths: ["plugins/**"]
permissions:
  contents: read
jobs:
  perfil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Testes do perfil so descoberta
        run: python3 -I -m unittest discover -s plugins/vvah -v
